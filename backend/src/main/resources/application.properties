spring.application.name=mantenimiento
server.port=8080

# Conexión a SQL Server. Desde tu IDE el host es localhost; en Docker Compose DB_HOST será "db".
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=mantenimiento_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:app_mant}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea TU script SQL; Hibernate solo valida que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seguridad (Fase 3)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}