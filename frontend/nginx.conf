server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a la API se reenvían al contenedor del backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Cualquier otra ruta la resuelve Angular (necesario para refrescar /equipos/5)
    location / {
        try_files $uri $uri/ /index.html;
    }
}