<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm" style="width: 22rem;">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-4">Gestor de Mantenimiento</h1>

      <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" type="text" class="form-control"
                 formControlName="username" autocomplete="username"
                 [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid">
          @if (form.controls.username.touched && form.controls.username.hasError('required')) {
            <div class="invalid-feedback">El usuario es obligatorio</div>
          }
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control"
                 formControlName="password" autocomplete="current-password"
                 [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
          @if (form.controls.password.touched && form.controls.password.hasError('required')) {
            <div class="invalid-feedback">La contraseña es obligatoria</div>
          }
        </div>

          @if (error()) {
          <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          {{ cargando() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
