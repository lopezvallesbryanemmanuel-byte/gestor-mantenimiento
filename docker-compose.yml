services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: gestor-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql # los datos sobreviven si apagas el contenedor
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: gestor-db-init
    depends_on:
      db:
        condition: service_healthy # espera a que SQL Server responda
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  backend:
    build: ./backend
    container_name: mant-backend
    depends_on:
      db-init:
        condition: service_completed_successfully # arranca cuando la BD ya tiene tablas
    environment:
      DB_HOST: db # nombre del servicio de SQL Server
      DB_USER: app_mant
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: mant-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mssql-data: